<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> html 제목 태그 예제 </title>
     <style>
        #myHeader {
            background-color: #ffd3d3;
            color: #333;
            padding: 32px;
            text-align: center;
        }
        .note {
            background-color: #ffff37;
            font-weight: bold;
        }
    </style>
    </head>

    <body>
        <h1 id="myHeader">HTML 기초 실습</h1>
        
        <div style="background-color: #cadbff;">
        <h2>자주 사용하는 html 태그</h2>
        </div>

        <p>html은 웹페이지의 <span class="note">구조</span>를 만드는 언어입니다. 
        <br>다양한 태그를 사용하여 문서를 구성할 수 있습니다.</p>
    </body>
</html>
