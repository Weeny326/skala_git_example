<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>html 목록 태그 예제</title>
    </head>

    <body>
        <section class="card">
            <h2>좋아하는 과일</h2>
            <ul style="list-style:disc;">
                <li>사과</li>
                <li>바나나</li>
                <li>오렌지</li>
            </ul>

            <h2>웹페이지 제작 순서</h2>
            <ol type="1">
                <li>HTML 작성</li>
                <li>CSS 작성</li>
                <li>JavaScript 추가</li>
            </ol>

            <h2>Html 용어</h2>
            <dl>
                <dt>HTML</dt>
                <dd>웹페이지를 만들기 위한 마크업 언어</dd>
                <dt>CSS</dt>
                <dd>웹페이지의 스타일을 지정하는 언어</dd>
                <dt>JavaScript</dt>
                <dd>웹페이지에 동적인 기능을 추가하는 프로그래밍 언어</dd>
        </section>
    </body>
</html>
