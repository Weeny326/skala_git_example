<!DOCTYPE html>

        <link rel="stylesheet" href="example.css">
    </head>

    <body class="main-page">
        <main class="container">
            <section class="card">
                <h1 id="myHeader">예제모음~</h1>
                <a href="제목.html" target="_blank">제목 관련 태그</a>

            <section class="form">
            <h1>html forms</h1>
            <form action="signupresult.php" method="post">
            <fieldset>
                <legend>회원가입</legend>
                <p>
                    <label for="userid">사용자 이름:</label>
                    <input type="text" id="userid" name="userid" minlength="4" maxlength="15" required placeholder="4~15자 영문/숫자">
                    <small>필수</small>
                </p>
                <p>
                    <label for="password">비밀번호:</label>
                    <input type="password" id="password" name="password" minlength="8" maxlength="20" required placeholder="8자 이상 입력">
                    <small>필수</small>
                </p>
                <p>
                    <label for="email">이메일:</label>
                    <input type="email" id="email" name="email" placeholder="mail">
                    @
                    <select name="domain" id="emaildomain">
                        <option value="direct">직접 입력</option>
                        <option value="naver.com">naver.com</option>
                        <option value="gmail.com">gmail.com</option>
                        <option value="daum.net">daum.net</option>
                    </select>
                </p>
            </fieldset>
            <button type="submit">가입</button>
            <!-- 버튼 못생겼음 -->
            </section>
        </form>
    </main>
    </body>
</html>
